[project]
name = "agiofit"
version = "0.1.0"
description = "Reference implementation of the Agio Fit portable fit profile"
requires-python = ">=3.10"
dependencies = []
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
agiofit = "agiofit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
